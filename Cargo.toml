[workspace]
resolver = "3"
members = ["rhyperx", "rhyperx-macros", "rhyperx-tests", "rhyperx-core", "rhyperx-io", "rhyperx-algo"]

[workspace.dependencies]
rhyperx = { path = "./rhyperx" }
rhyperx-macros = { path = "./rhyperx-macros" }
rhyperx-tests = { path = "./rhyperx-tests" }
rhyperx-core = { path = "./rhyperx-core" }
rhyperx-io = { path = "./rhyperx-io" }
rhyperx-algo = { path = "./rhyperx-algo" }

thiserror = "2.0.18"
hashbrown = "0.17.1"
foldhash = "0.2.0"
paste = "1.0.15"
indicatif = "0.18.4"
anyhow = "1.0.103"
seq-macro = "0.3.6"
num-traits = "0.2"
rand = "0.10.2"
nohash-hasher = "0.2.0"
rapidhash = "4.5.1"
bit-set = "0.10"
log = "0.4.29"
env_logger = "0.11.11"
inherent = "1.0.13"
duplicate = "2.0.1"
better_default = "1.0.5"
rkyv = { version = "0.8.15", features = ["hashbrown-0_17"] }

# pyo3 = {version = "0.29.0", features = ["auto-initialize", "multiple-pymethods", "hashbrown", "anyhow"]}
# pyo3-stub-gen = { git = "https://github.com/mattia-marini/pyo3-stub-gen", branch = "pyo3-0.29", features = ["hashbrown"] }

[profile.profiling]
inherits = "release"
debug = true


# Max performance
# [profile.release]
# opt-level = 3
# lto = "fat"
# codegen-units = 1
# panic = "abort"

# Optimized comp times
[profile.release]
opt-level = 2         # Great performance, faster than level 3
lto = false           # Disables heavy link-time optimization
codegen-units = 16    # Re-enables parallel compilation chunks
panic = "abort"       # Keeps binary size small and efficient
